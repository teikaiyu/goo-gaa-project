<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>goo-gaa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <button class="close" id="close" aria-label="Quit" title="Quit">&times;</button>

    <!-- AVATAR SLOT: the only place the avatar lives. See avatar.js for the contract. -->
    <div id="avatar" class="avatar-slot"></div>
    <!-- Speech line: the avatar's words, set by avatar.js. Hidden until the cloud has answered. -->
    <p id="speech" class="speech" hidden></p>

    <!-- READOUT: stays the same when the avatar is swapped. -->
    <section class="readout">
      <div class="time" id="time" aria-live="off">--:--:--</div>
      <div class="label">on social media (this session)</div>
    </section>
  </main>

  <script src="avatar.js"></script>
  <script src="app.js"></script>
</body>
</html>
